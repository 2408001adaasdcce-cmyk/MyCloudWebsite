
<!DOCTYPE html>
<html>
<head>
    <title>My Cloud Website</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #eaf2f8;
            margin: 0;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Cloud Website!</h1>

        <p>
            This website is created using HTML and CSS.
        </p>

        <p>
            It is deployed using GitHub and Vercel.
        </p>

        <button onclick="alert('Website is working!')">
            Click Me
        </button>
    </div>

</body>
</html>
